<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tour Vacation Travel</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600;1,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
</head>
<body>
  <app-root></app-root>

  <div id="app-loader" style="
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  ">
    <img src="/logo-horizontal.webp" alt="Tour Vacation Travel" style="
      height: 44px;
      width: auto;
      animation: loader-pulse 2s ease-in-out infinite;
    ">
    <div style="
      width: 48px;
      height: 2px;
      background: #e0d8cc;
      position: relative;
      overflow: hidden;
      border-radius: 1px;
    ">
      <div style="
        position: absolute;
        top: 0; bottom: 0;
        width: 50%;
        background: #c05a3a;
        animation: loader-bar 1.2s ease-in-out infinite;
      "></div>
    </div>
    <style>
      @keyframes loader-pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes loader-bar {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </div>
</body>
</html>
