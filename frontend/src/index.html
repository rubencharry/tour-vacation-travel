<body>
  <app-root></app-root>

  <div id="app-loader" style="
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  ">
    <img src="/logo-horizontal.webp" alt="Tour Vacation Travel" style="
      height: 44px;
      width: auto;
      animation: loader-pulse 2s ease-in-out infinite;
    ">
    <div style="
      width: 48px;
      height: 2px;
      background: #e0d8cc;
      position: relative;
      overflow: hidden;
      border-radius: 1px;
    ">
      <div style="
        position: absolute;
        top: 0; bottom: 0;
        width: 50%;
        background: #c05a3a;
        animation: loader-bar 1.2s ease-in-out infinite;
      "></div>
    </div>
    <style>
      @keyframes loader-pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes loader-bar {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </div>
</body>
